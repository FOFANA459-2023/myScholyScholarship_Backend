# MyScholy backend CI/CD (Django REST; Oracle Cloud primary, Render secondary).
#
# Every push and PR: lint (ruff) -> Django tests with coverage -> dependency
# audit. Deploys fire ONLY on push to main after every gate passes: the Render
# deploy hook (secondary/staging) and an SSH deploy to the Oracle Cloud VM
# (primary, https://myscholy.duckdns.org). Keep Render's own "Auto-Deploy on
# commit" turned OFF so this pipeline is the single deploy trigger.
#
# Required repository configuration is documented in .github/DEPLOYMENT.md.
# Oracle deploy needs the ORACLE_HOST and ORACLE_SSH_KEY repository secrets.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Backend / lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Backend / unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Django system checks
        run: python manage.py check --settings=scholarship_backend.settings_test
      - name: Run tests with coverage
        run: |
          coverage run manage.py test --settings=scholarship_backend.settings_test
          coverage report --skip-empty
          coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  audit:
    name: Security / dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (production requirements)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  deploy:
    name: Deploy / Render (secondary)
    runs-on: ubuntu-latest
    # Generous: a free-tier build plus its health check can take a while.
    timeout-minutes: 25
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, audit]
    environment:
      name: production
      url: https://myscholyscholarship-backend.onrender.com
    steps:
      - name: Trigger Render deploy hook
        id: trigger
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set" >&2
            exit 1
          fi
          response=$(curl -fsS -X POST "$DEPLOY_HOOK")
          # The hook answers {"deploy":{"id":"dep-..."}}; the service id is in
          # the hook URL itself (.../deploy/srv-xxxx?key=...). Parsing failures
          # must never fail the deploy - verification degrades to a warning.
          deploy_id=$(printf '%s' "$response" | jq -r '.deploy.id // empty' 2>/dev/null || true)
          service_id=$(printf '%s' "$DEPLOY_HOOK" | sed -E 's#.*/deploy/([^?]+).*#\1#' || true)
          {
            echo "deploy_id=$deploy_id"
            echo "service_id=$service_id"
          } >> "$GITHUB_OUTPUT"
          echo "Render deploy ${deploy_id:-<id unavailable>} triggered."
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      # Firing the hook only proves Render accepted the request. Without this
      # step a failed build still leaves the pipeline green, which is why
      # "deploy failed" emails could arrive while CI reported success.
      - name: Verify the Render build actually succeeded
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
          SERVICE_ID: ${{ steps.trigger.outputs.service_id }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::warning::RENDER_API_KEY is not set, so the build result cannot be verified. Add it at Settings -> Secrets -> Actions (create the key at dashboard.render.com/u/settings#api-keys)."
            exit 0
          fi
          if [ -z "$DEPLOY_ID" ] || [ -z "$SERVICE_ID" ]; then
            echo "::warning::Render did not return a deploy id, so the build result cannot be verified."
            exit 0
          fi

          api="https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID"
          for attempt in $(seq 1 90); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
                       -H "Accept: application/json" "$api" | jq -r '.status // "unknown"')
            echo "attempt $attempt: $status"
            case "$status" in
              live)
                echo "Render deploy succeeded."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|deactivated)
                echo "::error::Render deploy finished as '$status'. Open the service's Events tab at dashboard.render.com for the build log."
                exit 1
                ;;
              canceled)
                # Benign on its own: a newer deploy superseded this one. It is
                # also the signature of Render's Auto-Deploy racing this hook,
                # which is why it is surfaced rather than ignored.
                echo "::warning::Render deploy was canceled, which normally means another deploy superseded it. If this repeats on every push, turn Auto-Deploy OFF in the Render dashboard so this pipeline is the only trigger."
                exit 0
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out after 15 minutes waiting for the Render deploy to finish."
          exit 1

  deploy-oracle:
    name: Deploy / Oracle (primary)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, audit]
    environment:
      name: production-oracle
      url: https://myscholy.duckdns.org
    steps:
      - name: Deploy over SSH
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -z "$ORACLE_HOST" ] || [ -z "$ORACLE_SSH_KEY" ]; then
            echo "ORACLE_HOST / ORACLE_SSH_KEY repository secrets are not set" >&2
            exit 1
          fi
          printf '%s\n' "$ORACLE_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new ubuntu@"$ORACLE_HOST" '
            set -e
            cd ~/myscholy-backend
            git pull --ff-only
            venv/bin/pip install -q -r requirements.txt
            venv/bin/python manage.py migrate --noinput
            venv/bin/python manage.py collectstatic --noinput
            sudo systemctl restart myscholy
          '
      - name: Health check
        run: |
          sleep 5
          curl -fsS -o /dev/null -w 'API healthy: HTTP %{http_code}\n' https://myscholy.duckdns.org/api/scholarships/
